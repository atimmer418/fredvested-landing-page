spring.application.name=web
# Database configuration (Railway will inject DATABASE_URL)
# Schema is owned by Flyway migrations (db/migration/) as of V1. Hibernate only
# validates the entities against that schema on boot -- it never mutates it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway: adopt schemas that already have the V1 tables (from the old ddl-auto=update
# era) without re-running V1 against them -- it just records V1 as already applied.
# Has no effect on a genuinely empty database, which runs every migration from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# HikariCP Configuration
# Set max-lifetime to 10 minutes (600000ms) to prevent using stale connections
spring.datasource.hikari.max-lifetime=600000
# Set idle-timeout to 5 minutes (300000ms) to fix "idleTimeout is close to or more than maxLifetime" warning
spring.datasource.hikari.idle-timeout=300000
# Increase connection timeout to 60s (was 30s) to allow sleeping DBs to wake up
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# Server configuration
server.port=${PORT:8080}

# Logging
logging.level.com.fredvested=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:WARN}

# Cloudflare Turnstile
cloudflare.turnstile.secret=${CLOUDFLARE_TURNSTILE_SECRET}

# Email funnel
# Double opt-in: signups get a confirmation link and count as confirmed only after
# clicking it. Off = a single welcome email, no confirmation gate.
waitlist.double-opt-in.enabled=${WAITLIST_DOUBLE_OPT_IN:true}
waitlist.confirmation.ttl-days=7
# Absolute origin of THIS API, used in the confirm/unsubscribe links inside emails
api.public-url=${API_PUBLIC_URL:http://localhost:8081}
email.from=${EMAIL_FROM:FRED <fred@fredvested.com>}
# Rendered in every email footer (CAN-SPAM postal address). Visible placeholder until set.
email.postal-address=${POSTAL_ADDRESS:[PO Box pending]}
# Reply-To on every message, so sending from a subdomain never strands a reply
email.reply-to=${EMAIL_REPLY_TO:help@fredvested.com}
email.outbox.poll-ms=5000
# Exponential backoff (1m, 2m, 4m ... 256m, then capped at 6h): 12 attempts span about 20 hours
email.outbox.max-attempts=12
# A row claimed by a publisher that then died is retried after this long
email.outbox.stale-sending-minutes=15
# Resend webhook signing secret (whsec_...). Empty = every webhook delivery is rejected with 401.
resend.webhook-secret=${RESEND_WEBHOOK_SECRET:}

# CORS Origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
